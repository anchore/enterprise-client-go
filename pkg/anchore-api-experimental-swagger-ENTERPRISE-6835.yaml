          description: The type of SBOM being uploaded. (The values are just placeholders for now)
          enum:
            - container
            - filesystem
            - repository
            - other
    SBOMUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          # Disallow whitespace-only
          pattern: ^(?!\s*$).+
        version:
          type: string
          minLength: 1
          # Disallow whitespace-only
          pattern: ^(?!\s*$).+
        annotations:
          type: string
          description: A json string representing a dict of string type key value pairs
          example: "{'color': 'blue'}"
        groups:
          type: string
          description: A comma separated list of Group UUIDs
          items:
            type: string
        file:
          type: string
          format: binary
          description: A valid SBOM file
    SBOMGroupDetail:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        account_name:
          type: string
        version:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sboms:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
              name:
                type: string
              version:
                type: string
        has_supported_sboms:
          type: boolean
          description: >-
            Indicates whether the SBOM Group contains at least one SBOM that is
            supported for vulnerability scanning and content listing.
        has_unsupported_sboms:
          type: boolean
          description: >-
            Indicates whether the SBOM Group contains at least one SBOM that is
            NOT supported for vulnerability scanning and content listing.
        quality_score:
          type: number
          format: float
    SBOMGroupDetailList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SBOMGroupDetail'
    SBOMVulnerability:
      type: object
      required:
          - cve
          - cve_uri
          - severity
          - anchore_rank
          - anchore_score
          - cvss_score
          - epss_score
          - epss_percentile
          - is_kev
          - advisory
          - advisory_uri
          - last_found_at
      properties:
        cve:
          type: string
        cve_uri:
          type: string
        severity:
          type: string
          enum:
            - unknown
            - negligible
            - low
            - medium
            - high
            - critical
        anchore_rank:
          type: number
          format: int
          description: >-
            The Anchore Rank is a numerical representation of the importance of a vulnerability based on Anchore Score, 
            relative to all other vulnerabilities found within a given SBOM or SBOM Group. The vulnerability with 
            Anchore Rank 1 is considered to be the most important in the SBOM or SBOM Group being queried. The most 
            important vulnerabilities for a given SBOM or SBOM Group may not always appear in the result set depending 
            on the given filter criteria.
        anchore_score:
          type: number
          format: float
        cvss_score:
          type: number
          format: float
          description: >-
            The greatest CNA CVSS score for the vulnerability across all provider data sources, or the NVD CVSS score 
            if no provider data sources are available.
        epss_score:
          type: number
          format: float
        epss_percentile:
          type: number
          format: float
        is_kev:
          type: boolean
          description: >-
            Indicates whether the vulnerability appears on the CISA KEV (Known Exploited Vulnerability) list.
        advisory:
          type: string
        advisory_uri:
          type: string
        last_found_at:
          type: string
          format: date-time
          description: >-
            The time that this vulnerability was most recently found
            in the given SBOM or an SBOM within the given SBOM Group for the first time.
    SBOMVulnerabilityListCounts:
      type: object
      required:
        - critical
        - high
        - medium
        - low
        - negligible
        - unknown
        - total
      properties:
        critical:
          type: number
          format: int
        high:
          type: number
          format: int
        medium:
          type: number
          format: int
        low:
          type: number
          format: int
        negligible:
          type: number
          format: int
        unknown:
          type: number
          format: int
        total:
          type: number
          format: int
    SBOMVulnerabilityList:
      type: object
      required:
        - vulnerability_counts
        - items
      properties:
        vulnerability_counts:
          $ref: '#/components/schemas/SBOMVulnerabilityListCounts'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SBOMVulnerability'
    SBOMGroupMembershipResponse:
      type: object
      properties:
        sbom_uuids:
          description: The list of SBOM UUIDs belonging to the Group after the requested changes
          type: array
          items:
            type: string
    SBOMBulkGroupMembershipResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/SBOMGroupMembershipResponse'
      example:
        group_uuid_1:
          sbom_uuids: [ sbom_uuid_1 ]
        group_uuid_2:
          sbom_uuids: [ sbom_uuid_1, sbom_uuid_2 ]
    SBOMGroupMembershipRequest:
      type: object
      properties:
        remove_all:
          description: >-
            Setting this to True will cause ALL SBOMs to be removed from the group.
            Cannot be used in combination with the add_sboms or remove_sboms properties.
          type: boolean
        add_sboms:
          description: A list of SBOM UUIDs to be added to the Group
          type: array
          items:
            type: string
        remove_sboms:
          description: A list of SBOM UUIDs to be removed from the Group
          type: array
          items:
            type: string
    SBOMBulkGroupMembershipRequest:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            type: object
            required:
              - group_uuid
            properties:
              group_uuid:
                type: string
              remove_all:
                description: >-
                  Setting this to True will cause ALL SBOMs to be removed from the group.
                  Cannot be used in combination with the add_sboms or remove_sboms properties.
                type: boolean
              add_sboms:
                description: A list of SBOM UUIDs to be added to the Group
                type: array
                items:
                  type: string
              remove_sboms:
                description: A list of SBOM UUIDs to be removed from the Group
                type: array
                items:
                  type: string
    AnyValue: {}
    NullType:
      title: OpenAPI 3.0.` null-type ref
      description: for adding nullability to a ref
      enum:
        - null
    ApiErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        error_type:
          type: string
        message:
          type: string
        detail:
          type: object
          properties: {}
          description: Details structure for additional information about the error
            if available. Content and structure will be error specific.
      description: Generic HTTP API error response
