openapi: 3.0.1
info:
  title: Anchore Experimental API
  description: This is the Anchore Experiment API. Interfaces in this specification are unstable and will change in breaking ways between releases of Anchore Enterprise.
  contact:
    email: dev@anchore.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.9.1
servers:
  - url: /exp
tags:
  - name: System
    description: System
  - name: Images
    description: Image Management
paths:
  /:
    get:
      tags:
        - System
      description: Simple status check
      operationId: ping
      responses:
        200:
          description: Version check response, returns the api version prefix (e.g. 'v2')
          content:
            application/json:
              schema:
                type: string
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.system
      x-anchore-authz-action: None
  /images:
    get:
      tags:
        - Images
      summary: Summarize images by registry and repository
      description: Count tags and show subscription status per repository
      operationId: summary_images
      parameters:
        - name: order_by
          in: query
          description: List of field name(s) to order by, ascending by default
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - registry
                - repo
                - tag_count
                - latest_analyzed_at
                - alert
                - watch_repo
        - name: order_by_descending
          in: query
          description: >-
            Configures the sort order of each specified order_by
            column to be descending (true) instead of ascending (false)
          style: form
          explode: false
          schema:
            type: array
            items:
              type: boolean
        - name: filter
          in: query
          description: >-
            Filter against 'registry', 'repo', or 'tag_count' fields,
            using partial or full string match
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of rows to return
          schema:
            type: integer
        - name: page
          in: query
          description: Page number to return, one's based
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchoreSummaryImages"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /images/registry:
    get:
      tags:
        - Images
      summary: Summarize image registry
      description: List repos within a registry including analysis stats
      operationId: summary_images_for_registry
      parameters:
        - name: registry
          in: query
          description: Registry name
          required: true
          schema:
            type: string
        - name: order_by
          in: query
          description: List of field name(s) to order by, ascending by default
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - repo
                - image_count
                - latest_analyzed_at
                - alert
                - watch_repo
        - name: order_by_descending
          in: query
          description: >-
            Configures the sort order of each specified order_by
            column to be descending (true) instead of ascending (false)
          style: form
          explode: false
          schema:
            type: array
            items:
              type: boolean
        - name: filter
          in: query
          description: Filter against 'repo' field, using partial or full string match
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of rows to return
          schema:
            type: integer
        - name: page
          in: query
          description: Page number to return, one's based
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchoreSummaryImageRegistry"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /images/repo:
    get:
      tags:
        - Images
      summary: Summarize image repository
      description: List tags within a registry/repo including image count and last_seen inventory
      operationId: summary_images_for_repo
      parameters:
        - name: registry
          in: query
          description: Registry name
          required: true
          schema:
            type: string
        - name: repo
          in: query
          description: Repository name
          required: true
          schema:
            type: string
        - name: order_by
          in: query
          description: List of field name(s) to order by, ascending by default
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - tag
                - analysis_status
                - image_count
                - latest_tag_detected_at
                - image_digest
                - alert
                - watch_tag
                - last_seen
        - name: order_by_descending
          in: query
          description: >-
            Configures the sort order of each specified order_by
            column to be descending (true) instead of ascending (false)
          style: form
          explode: false
          schema:
            type: array
            items:
              type: boolean
        - name: filter
          in: query
          description: >-
            Filter against 'tag', 'analysis_status', or 'image_digest' fields,
            using partial or full string match
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of rows to return
          schema:
            type: integer
        - name: page
          in: query
          description: Page number to return, one's based
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchoreSummaryImageRepo"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /images/tag:
    get:
      tags:
        - Images
      summary: Summary image digests for a registry/repo:tag
      description: List digests for a given registry/repo:tag including last_seen inventory
      operationId: summary_images_for_tag
      parameters:
        - name: registry
          in: query
          description: Registry name
          required: true
          schema:
            type: string
        - name: repo
          in: query
          description: Repository name
          required: true
          schema:
            type: string
        - name: tag
          in: query
          description: Tag name
          required: true
          schema:
            type: string
        - name: order_by
          in: query
          description: List of field name(s) to order by, ascending by default
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - analysis_status
                - image_digest
                - tag_detected_at
                - analyzed_at
                - image_id
                - last_seen
        - name: order_by_descending
          in: query
          description: >-
            Configures the sort order of each specified order_by
            column to be descending (true) instead of ascending (false)
          style: form
          explode: false
          schema:
            type: array
            items:
              type: boolean
        - name: filter
          in: query
          description: >-
            Filter against 'image_digest', 'image_id', or 'analysis_status' fields,
            using partial or full string match
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of rows to return
          schema:
            type: integer
        - name: page
          in: query
          description: Page number to return, one's based
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchoreSummaryImageTag"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /kubernetes-clusters:
    get:
      tags:
        - Inventories
      summary: Return a summary of Kubernetes clusters and namespaces for this account
      description: Return a summary of Kubernetes clusters and namespaces for this account
      operationId: get_kubernetes_clusters
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchoreSummaryKubernetesClusters"
        500:
          description: Internal Error
          content: {}
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.runtime_inventory
      x-anchore-authz-action: getKubernetesClusters
  /kubernetes-vulnerabilities-summary:
    get:
      tags:
        - Inventories
      summary: Return a summary of vulnerabilities found within the Kubernetes inventory for this account
      description: Return a summary of vulnerabilities found within the Kubernetes inventory for this account
      operationId: get_kubernetes_vulnerabilities_summary
      parameters:
        - name: context
          in: query
          description: Matches on an exact cluster name or exact cluster/namespace combination
          schema:
            type: string
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchoreSummaryKubernetesVulnerabilities"
        500:
          description: Internal Error
          content: {}
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.runtime_inventory
      x-anchore-authz-action: getKubernetesVulnerabilities
  /sboms/{sbom_uuid}/revisions/{revision_uuid}/file:
    get:
      tags:
        - SBOM Management
      summary: Download the content of a specific revision of a given SBOM revision
      operationId: get_sbom_revision_file
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type: string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - name: revision_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        200:
          description: success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: Not Found
          content: { }
        500:
          description: Internal Error
          content: { }
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/revisions/{revision_uuid}:
    get:
      tags:
        - SBOM Management
      summary: Get the metadata for a specific revision of a given SBOM
      operationId: get_sbom_revision
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type:
              string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - name: revision_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBOMDetail"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
    delete:
      tags:
        - SBOM Management
      summary: Delete a specific revision of a given SBOM
      operationId: delete_sbom_revision
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type:
              string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - name: revision_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        204:
          description: success
          content: {}
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: deleteAsset
  /sboms/{sbom_uuid}/file:
    get:
      tags:
        - SBOM Management
      summary: Download the content of the latest revision of a given SBOM
      operationId: get_sbom_file
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type:
              string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        200:
          description: success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: Not Found
          content: { }
        500:
          description: Internal Error
          content: { }
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/packages:
    get:
      tags:
        - SBOM Management
      summary: Return the package information for the latest revision of a given SBOM, this is sorted
        alphabetically by default
      operationId: get_latest_sbom_packages_by_uuid
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type:
              string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - name: limit
          in: query
          description: Maximum number of rows to return per page
          schema:
            type: integer
            default: 1000
        - name: page
          in: query
          description: Page number to return
          schema:
            type: integer
            default: 1
        - name: order_by
          in: query
          description: Field name to order by, ascending by default
          schema:
            type: string
            enum:
              - name
        - name: order_by_descending
          in: query
          description: >-
            Configures the sort order of the specified order_by
            value to be descending (true) instead of ascending (false)
          schema:
            type: boolean
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBOMPackageDetail"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/vulnerabilities/detail-csv:
    get:
      tags:
        - SBOM Management
      summary: >-
        Download a csv file containing a list of package 
        vulnerabilities found within a given SBOM during the most recent scan.
      operationId: get_sbom_vulnerabilities_csv
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type:
              string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - name: force_refresh
          in: query
          description: Force a re-scan of SBOM vulnerabilities before returning results
          schema:
            type: boolean
            default: false
        - name: anchore_score
          in: query
          description: The minimum Anchore Score to be included in the results
          schema:
            type: number
            format: float
        - name: cvss_score
          in: query
          description: The minimum CVSS Score to be included in the results
          schema:
            type: number
            format: float
        - name: epss_score
          in: query
          description: The minimum EPSS Score to be included in the results
          schema:
            type: number
            format: float
        - name: epss_percentile
          in: query
          description: The minimum EPSS Percentile to be included in the results
          schema:
            type: number
            format: float
        - name: is_kev
          in: query
          description: Filter results based on presence in the CISA Known Exploitable Vulnerabilities list
          schema:
            type: boolean
        - name: severity
          in: query
          description: The minimum severity to be included in the results
          schema:
            type: string
            enum:
              - unknown
              - negligible
              - low
              - medium
              - high
              - critical
        - name: last_found_after
          in: query
          description: The earliest last_found_at date to be included in the results
          schema:
            type: string
            format: date-time
            example: 2024-12-31T14:40:46
        - name: last_found_before
          in: query
          description: The latest last_found_at date to be included in the results
          schema:
            type: string
            format: date-time
            example: 2024-12-31T14:40:46
        - name: order_by
          in: query
          description: List of field name(s) to order by, ascending by default
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - cve
                - anchore_score
                - cvss_score
                - epss_score
                - epss_percentile
                - is_kev
                - severity
                - advisory
                - last_found_at
        - name: order_by_descending
          in: query
          description: >-
            Configures the sort order of each specified order_by
            column to be descending (true) instead of ascending (false)
          style: form
          explode: false
          schema:
            type: array
            items:
              type: boolean
      responses:
        200:
          description: success
          content:
            application/csv:
              schema:
                type: string
                format: binary
        404:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/vulnerabilities:
    get:
      tags:
        - SBOM Management
      summary: >-
        Get a list of vulnerabilities found within a given SBOM during the most recent scan.
        Returns summary data of the complete result set and a list of the first 100 results.
      operationId: list_sbom_vulnerabilities
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type:
              string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - name: force_refresh
          in: query
          description: Force a re-scan of SBOM vulnerabilities before returning results
          schema:
            type: boolean
            default: false
        - name: anchore_score
          in: query
          description: The minimum Anchore Score to be included in the results
          schema:
            type: number
            format: float
        - name: cvss_score
          in: query
          description: The minimum CVSS Score to be included in the results
          schema:
            type: number
            format: float
        - name: epss_score
          in: query
          description: The minimum EPSS Score to be included in the results
          schema:
            type: number
            format: float
        - name: epss_percentile
          in: query
          description: The minimum EPSS Percentile to be included in the results
          schema:
            type: number
            format: float
        - name: is_kev
          in: query
          description: Filter results based on presence in the CISA Known Exploitable Vulnerabilities list
          schema:
            type: boolean
        - name: severity
          in: query
          description: The minimum severity to be included in the results
          schema:
            type: string
            enum:
              - unknown
              - negligible
              - low
              - medium
              - high
              - critical
        - name: last_found_after
          in: query
          description: The earliest last_found_at date to be included in the results
          schema:
            type: string
            format: date-time
            example: 2024-12-31T14:40:46
        - name: last_found_before
          in: query
          description: The latest last_found_at date to be included in the results
          schema:
            type: string
            format: date-time
            example: 2024-12-31T14:40:46
        - name: order_by
          in: query
          description: List of field name(s) to order by, ascending by default
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - cve
                - anchore_score
                - cvss_score
                - epss_score
                - epss_percentile
                - is_kev
                - severity
                - advisory
                - last_found_at
        - name: order_by_descending
          in: query
          description: >-
            Configures the sort order of each specified order_by
            column to be descending (true) instead of ascending (false)
          style: form
          explode: false
          schema:
            type: array
            items:
              type: boolean
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBOMVulnerabilityList"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}:
    get:
      tags:
        - SBOM Management
      summary: Get the metadata of the latest revision of a given SBOM
      operationId: get_latest_sbom_by_uuid
      parameters:
        - name: x-anchore-account
          in: header
          description: The account name used for the resource scope of this request as user permissions allow
          schema:
            type:
              string
        - name: sbom_uuid
          in: path
          required: true
          schema:
            type: string
            format: path
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SBOMDetail"
        404:
          description: Not Found
          content:
            application/json:
