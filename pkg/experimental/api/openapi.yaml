openapi: 3.0.1
info:
  contact:
    email: dev@anchore.com
  description: This is the Anchore Experiment API. Interfaces in this specification
    are unstable and will change in breaking ways between releases of Anchore Enterprise.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Anchore Experimental API
  version: 0.9.1
servers:
- url: /exp
tags:
- description: System
  name: System
- description: Image Management
  name: Images
paths:
  /:
    get:
      description: Simple status check
      operationId: ping
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: "Version check response, returns the api version prefix (e.g.\
            \ 'v2')"
      tags:
      - System
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.system
      x-anchore-authz-action: None
  /images:
    get:
      description: Count tags and show subscription status per repository
      operationId: summary_images
      parameters:
      - description: "List of field name(s) to order by, ascending by default"
        explode: false
        in: query
        name: order_by
        required: false
        schema:
          items:
            enum:
            - registry
            - repo
            - tag_count
            - latest_analyzed_at
            - alert
            - watch_repo
            type: string
          type: array
        style: form
      - description: Configures the sort order of each specified order_by column to
          be descending (true) instead of ascending (false)
        explode: false
        in: query
        name: order_by_descending
        required: false
        schema:
          items:
            type: boolean
          type: array
        style: form
      - description: "Filter against 'registry', 'repo', or 'tag_count' fields, using\
          \ partial or full string match"
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: Maximum number of rows to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: "Page number to return, one's based"
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchoreSummaryImages'
          description: successful operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: Summarize images by registry and repository
      tags:
      - Images
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /images/registry:
    get:
      description: List repos within a registry including analysis stats
      operationId: summary_images_for_registry
      parameters:
      - description: Registry name
        explode: true
        in: query
        name: registry
        required: true
        schema:
          type: string
        style: form
      - description: "List of field name(s) to order by, ascending by default"
        explode: false
        in: query
        name: order_by
        required: false
        schema:
          items:
            enum:
            - repo
            - image_count
            - latest_analyzed_at
            - alert
            - watch_repo
            type: string
          type: array
        style: form
      - description: Configures the sort order of each specified order_by column to
          be descending (true) instead of ascending (false)
        explode: false
        in: query
        name: order_by_descending
        required: false
        schema:
          items:
            type: boolean
          type: array
        style: form
      - description: "Filter against 'repo' field, using partial or full string match"
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: Maximum number of rows to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: "Page number to return, one's based"
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchoreSummaryImageRegistry'
          description: successful operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: Summarize image registry
      tags:
      - Images
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /images/repo:
    get:
      description: List tags within a registry/repo including image count and last_seen
        inventory
      operationId: summary_images_for_repo
      parameters:
      - description: Registry name
        explode: true
        in: query
        name: registry
        required: true
        schema:
          type: string
        style: form
      - description: Repository name
        explode: true
        in: query
        name: repo
        required: true
        schema:
          type: string
        style: form
      - description: "List of field name(s) to order by, ascending by default"
        explode: false
        in: query
        name: order_by
        required: false
        schema:
          items:
            enum:
            - tag
            - analysis_status
            - image_count
            - latest_tag_detected_at
            - image_digest
            - alert
            - watch_tag
            - last_seen
            type: string
          type: array
        style: form
      - description: Configures the sort order of each specified order_by column to
          be descending (true) instead of ascending (false)
        explode: false
        in: query
        name: order_by_descending
        required: false
        schema:
          items:
            type: boolean
          type: array
        style: form
      - description: "Filter against 'tag', 'analysis_status', or 'image_digest' fields,\
          \ using partial or full string match"
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: Maximum number of rows to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: "Page number to return, one's based"
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchoreSummaryImageRepo'
          description: successful operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: Summarize image repository
      tags:
      - Images
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /images/tag:
    get:
      description: List digests for a given registry/repo:tag including last_seen
        inventory
      operationId: summary_images_for_tag
      parameters:
      - description: Registry name
        explode: true
        in: query
        name: registry
        required: true
        schema:
          type: string
        style: form
      - description: Repository name
        explode: true
        in: query
        name: repo
        required: true
        schema:
          type: string
        style: form
      - description: Tag name
        explode: true
        in: query
        name: tag
        required: true
        schema:
          type: string
        style: form
      - description: "List of field name(s) to order by, ascending by default"
        explode: false
        in: query
        name: order_by
        required: false
        schema:
          items:
            enum:
            - analysis_status
            - image_digest
            - tag_detected_at
            - analyzed_at
            - image_id
            - last_seen
            type: string
          type: array
        style: form
      - description: Configures the sort order of each specified order_by column to
          be descending (true) instead of ascending (false)
        explode: false
        in: query
        name: order_by_descending
        required: false
        schema:
          items:
            type: boolean
          type: array
        style: form
      - description: "Filter against 'image_digest', 'image_id', or 'analysis_status'\
          \ fields, using partial or full string match"
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: Maximum number of rows to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: "Page number to return, one's based"
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchoreSummaryImageTag'
          description: successful operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: Summary image digests for a registry/repo:tag
      tags:
      - Images
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.images
      x-anchore-authz-action: listImages
  /kubernetes-clusters:
    get:
      description: Return a summary of Kubernetes clusters and namespaces for this
        account
      operationId: get_kubernetes_clusters
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchoreSummaryKubernetesClusters'
          description: success
        "500":
          content: {}
          description: Internal Error
      summary: Return a summary of Kubernetes clusters and namespaces for this account
      tags:
      - Inventories
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.runtime_inventory
      x-anchore-authz-action: getKubernetesClusters
  /kubernetes-vulnerabilities-summary:
    get:
      description: Return a summary of vulnerabilities found within the Kubernetes
        inventory for this account
      operationId: get_kubernetes_vulnerabilities_summary
      parameters:
      - description: Matches on an exact cluster name or exact cluster/namespace combination
        explode: true
        in: query
        name: context
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchoreSummaryKubernetesVulnerabilities'
          description: success
        "500":
          content: {}
          description: Internal Error
      summary: Return a summary of vulnerabilities found within the Kubernetes inventory
        for this account
      tags:
      - Inventories
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.runtime_inventory
      x-anchore-authz-action: getKubernetesVulnerabilities
  /sboms/{sbom_uuid}/revisions/{revision_uuid}/file:
    get:
      operationId: get_sbom_revision_file
      parameters:
      - description: The account name used for the resource scope of this request
          as user permissions allow
        explode: false
        in: header
        name: x-anchore-account
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sbom_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      - explode: false
        in: path
        name: revision_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: success
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Error
      summary: Download the content of a specific revision of a given SBOM revision
      tags:
      - SBOM Management
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/revisions/{revision_uuid}:
    delete:
      operationId: delete_sbom_revision
      parameters:
      - description: The account name used for the resource scope of this request
          as user permissions allow
        explode: false
        in: header
        name: x-anchore-account
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sbom_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      - explode: false
        in: path
        name: revision_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      responses:
        "204":
          content: {}
          description: success
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: Delete a specific revision of a given SBOM
      tags:
      - SBOM Management
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: deleteAsset
    get:
      operationId: get_sbom_revision
      parameters:
      - description: The account name used for the resource scope of this request
          as user permissions allow
        explode: false
        in: header
        name: x-anchore-account
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sbom_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      - explode: false
        in: path
        name: revision_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SBOMDetail'
          description: success
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: Get the metadata for a specific revision of a given SBOM
      tags:
      - SBOM Management
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/file:
    get:
      operationId: get_sbom_file
      parameters:
      - description: The account name used for the resource scope of this request
          as user permissions allow
        explode: false
        in: header
        name: x-anchore-account
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sbom_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: success
        "404":
          content: {}
          description: Not Found
        "500":
          content: {}
          description: Internal Error
      summary: Download the content of the latest revision of a given SBOM
      tags:
      - SBOM Management
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/packages:
    get:
      operationId: get_latest_sbom_packages_by_uuid
      parameters:
      - description: The account name used for the resource scope of this request
          as user permissions allow
        explode: false
        in: header
        name: x-anchore-account
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sbom_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      - description: Maximum number of rows to return per page
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          type: integer
        style: form
      - description: Page number to return
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - description: "Field name to order by, ascending by default"
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          enum:
          - name
          type: string
        style: form
      - description: Configures the sort order of the specified order_by value to
          be descending (true) instead of ascending (false)
        explode: true
        in: query
        name: order_by_descending
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SBOMPackageDetail'
          description: success
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: "Return the package information for the latest revision of a given\
        \ SBOM, this is sorted alphabetically by default"
      tags:
      - SBOM Management
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/vulnerabilities/detail-csv:
    get:
      operationId: get_sbom_vulnerabilities_csv
      parameters:
      - description: The account name used for the resource scope of this request
          as user permissions allow
        explode: false
        in: header
        name: x-anchore-account
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sbom_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      - description: Force a re-scan of SBOM vulnerabilities before returning results
        explode: true
        in: query
        name: force_refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: The minimum Anchore Score to be included in the results
        explode: true
        in: query
        name: anchore_score
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: The minimum CVSS Score to be included in the results
        explode: true
        in: query
        name: cvss_score
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: The minimum EPSS Score to be included in the results
        explode: true
        in: query
        name: epss_score
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: The minimum EPSS Percentile to be included in the results
        explode: true
        in: query
        name: epss_percentile
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: Filter results based on presence in the CISA Known Exploitable
          Vulnerabilities list
        explode: true
        in: query
        name: is_kev
        required: false
        schema:
          type: boolean
        style: form
      - description: The minimum severity to be included in the results
        explode: true
        in: query
        name: severity
        required: false
        schema:
          enum:
          - unknown
          - negligible
          - low
          - medium
          - high
          - critical
          type: string
        style: form
      - description: The earliest last_found_at date to be included in the results
        explode: true
        in: query
        name: last_found_after
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: The latest last_found_at date to be included in the results
        explode: true
        in: query
        name: last_found_before
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "List of field name(s) to order by, ascending by default"
        explode: false
        in: query
        name: order_by
        required: false
        schema:
          items:
            enum:
            - cve
            - anchore_score
            - cvss_score
            - epss_score
            - epss_percentile
            - is_kev
            - severity
            - advisory
            - last_found_at
            type: string
          type: array
        style: form
      - description: Configures the sort order of each specified order_by column to
          be descending (true) instead of ascending (false)
        explode: false
        in: query
        name: order_by_descending
        required: false
        schema:
          items:
            type: boolean
          type: array
        style: form
      responses:
        "200":
          content:
            application/csv:
              schema:
                format: binary
                type: string
          description: success
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Error
      summary: Download a csv file containing a list of package  vulnerabilities found
        within a given SBOM during the most recent scan.
      tags:
      - SBOM Management
      x-openapi-router-controller: anchore_enterprise.services.api.api.controllers.sbom_management
      x-anchore-authz-action: getAsset
  /sboms/{sbom_uuid}/vulnerabilities:
    get:
      operationId: list_sbom_vulnerabilities
      parameters:
      - description: The account name used for the resource scope of this request
          as user permissions allow
        explode: false
        in: header
        name: x-anchore-account
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sbom_uuid
        required: true
        schema:
          format: path
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
        style: simple
      - description: Force a re-scan of SBOM vulnerabilities before returning results
        explode: true
        in: query
        name: force_refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: The minimum Anchore Score to be included in the results
        explode: true
        in: query
        name: anchore_score
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: The minimum CVSS Score to be included in the results
        explode: true
        in: query
        name: cvss_score
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: The minimum EPSS Score to be included in the results
        explode: true
        in: query
        name: epss_score
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: The minimum EPSS Percentile to be included in the results
        explode: true
        in: query
        name: epss_percentile
        required: false
        schema:
          format: float
          type: number
        style: form
      - description: Filter results based on presence in the CISA Known Exploitable
          Vulnerabilities list
        explode: true
        in: query
        name: is_kev
        required: false
        schema:
          type: boolean
